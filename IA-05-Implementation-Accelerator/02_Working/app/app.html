<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Implementation Accelerator</title>
<style>
/* ===========================================================================
   Tokens. Rationale in 02_Working/notes/DESIGN_PLAN.md.
   Dark is the default: the EC business day is 9PM-6AM (Intro to Onboarding
   deck, slide 13). Light is a full peer.
   No box-shadow anywhere; separation is hairlines plus a 2px left rule whose
   colour carries meaning.
   =========================================================================== */
:root {
  --ground: #12171D;
  --panel: #1A212A;
  --panel-2: #212A34;
  --line: #2C3641;
  --line-soft: #232C36;
  --ink: #E6EAEE;
  --ink-soft: #9AA7B4;
  --signal: #6FA8DC;
  --signal-bg: #1B2836;
  --watch: #E0A84E;
  --watch-bg: #2A2318;
  --block: #E08585;
  --block-bg: #2B1D1D;
  --clear: #74C295;
  --clear-bg: #16271E;

  --w-par: #7E8C9B;
  --w-1: #5B8FC9;
  --w-2: #7A7FC9;
  --w-3: #A578C4;
  --w-4: #C98F5B;

  /* Type scale: four sizes, used everywhere. The fifth is a display size and
     appears only on the Leader stat tiles. No view invents its own. */
  --fs-lg: 16px;
  --fs-md: 14.5px;
  --fs-sm: 12.75px;
  --fs-xs: 11.25px;
  --fs-display: 25px;

  --r: 3px;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", SFMono-Regular, Consolas, Menlo, monospace;
  --dur: 120ms;
  --dur-view: 140ms;
  --dur-node: 260ms;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground: #F2F4F6; --panel: #FFFFFF; --panel-2: #F7F9FA;
    --line: #D4DAE1; --line-soft: #E4E9ED; --ink: #12171D; --ink-soft: #5A6775;
    --signal: #2A6099; --signal-bg: #E9F1F9; --watch: #8A5A0E; --watch-bg: #FBF2E1;
    --block: #A03434; --block-bg: #FBEAEA; --clear: #256B47; --clear-bg: #E6F3EC;
    --w-par: #5A6878; --w-1: #2A6099; --w-2: #4A4FA0; --w-3: #7A4A9B; --w-4: #965A1E;
  }
}
:root[data-theme="light"] {
  --ground: #F2F4F6; --panel: #FFFFFF; --panel-2: #F7F9FA;
  --line: #D4DAE1; --line-soft: #E4E9ED; --ink: #12171D; --ink-soft: #5A6775;
  --signal: #2A6099; --signal-bg: #E9F1F9; --watch: #8A5A0E; --watch-bg: #FBF2E1;
  --block: #A03434; --block-bg: #FBEAEA; --clear: #256B47; --clear-bg: #E6F3EC;
  --w-par: #5A6878; --w-1: #2A6099; --w-2: #4A4FA0; --w-3: #7A4A9B; --w-4: #965A1E;
}
@media (prefers-reduced-motion: reduce) {
  :root { --dur: 0.01ms; --dur-view: 0.01ms; --dur-node: 0.01ms; }
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: var(--fs-md)/1.55 var(--sans); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
.mono { font-family: var(--mono); }
.grow { margin-left: auto; }

/* --- shell ---------------------------------------------------------------- */
header.bar { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.brandrow { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-top: 14px; }
.brand { font-size: var(--fs-lg); font-weight: 650; letter-spacing: -0.01em; }
.teamid { font: 600 var(--fs-xs) var(--mono); color: var(--ink-soft); border: 1px solid var(--line); padding: 2px 6px; border-radius: var(--r); }
.here { margin-left: auto; font: 600 var(--fs-xs) var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--signal); }
.here::before { content: "\25B8\00a0"; }
nav.tabs { display: flex; margin-top: 12px; overflow-x: auto; }
nav.tabs button {
  font: 600 var(--fs-sm) var(--sans); color: var(--ink-soft); background: none;
  border: none; border-bottom: 2px solid transparent; padding: 9px 14px; cursor: pointer; white-space: nowrap;
  transition: color var(--dur) ease, border-color var(--dur) ease;
}
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--signal); }
nav.tabs button:focus-visible { outline: 2px solid var(--signal); outline-offset: -2px; }

main { padding: 20px 0 72px; }
section[role="tabpanel"] { display: none; }
section[role="tabpanel"].on { display: block; animation: vin var(--dur-view) ease both; }
@keyframes vin { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* --- primitives ----------------------------------------------------------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-left: 2px solid var(--line);
  border-radius: var(--r); padding: 14px 16px; margin-bottom: 12px; }
.panel.sig { border-left-color: var(--signal); }
.panel.watch { border-left-color: var(--watch); }
.panel.block { border-left-color: var(--block); }
.panel.clear { border-left-color: var(--clear); }
.panel.inset { margin: 10px 0; padding: 9px 11px; }
h2.sec, b.sec { display: block; font: 600 var(--fs-xs) var(--mono); letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-soft); margin: 22px 0 8px; }
.panel h2.sec:first-child { margin-top: 0; }
b.sec { margin: 0; }
h3 { font-size: var(--fs-lg); margin: 0 0 4px; letter-spacing: -0.01em; }
p { margin: 0 0 9px; }
.soft { color: var(--ink-soft); }
.sm { font-size: var(--fs-sm); }
.xs { font-size: var(--fs-xs); }
a { color: var(--signal); }
ul.bullets { margin: 0; padding-left: 20px; }
ul.bullets li { margin-bottom: 5px; }

.chip { display: inline-block; font: 600 var(--fs-xs) var(--mono); letter-spacing: .04em;
  padding: 2px 6px; border-radius: var(--r); border: 1px solid var(--line);
  color: var(--ink-soft); background: var(--panel-2); white-space: nowrap; }
.chip.sig { color: var(--signal); border-color: var(--signal); background: var(--signal-bg); }
.chip.watch { color: var(--watch); border-color: var(--watch); background: var(--watch-bg); }
.chip.block { color: var(--block); border-color: var(--block); background: var(--block-bg); }
.chip.clear { color: var(--clear); border-color: var(--clear); background: var(--clear-bg); }

.btn { font: 600 var(--fs-sm) var(--sans); color: var(--ink); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: var(--r); padding: 6px 11px; cursor: pointer;
  transition: background-color var(--dur) ease, border-color var(--dur) ease, color var(--dur) ease; }
.btn:hover { border-color: var(--signal); }
.btn:focus-visible { outline: 2px solid var(--signal); outline-offset: 1px; }
.btn[aria-pressed="true"] { border-color: var(--signal); color: var(--signal); background: var(--signal-bg); }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.rule { border: none; border-top: 1px solid var(--line-soft); margin: 12px 0; }
.scrollx { overflow-x: auto; }
.stack { display: grid; gap: 8px; }

select, input[type="text"] { font: var(--fs-md) var(--sans); color: var(--ink); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: var(--r); padding: 7px 8px; width: 100%;
  transition: border-color var(--dur) ease; }
select:focus, input[type="text"]:focus { outline: none; border-color: var(--signal); }
label.fl { display: block; font: 600 var(--fs-xs) var(--mono); letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-soft); margin-bottom: 4px; }

table { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
th { font: 600 var(--fs-xs) var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }

.cite { display: block; font-family: var(--mono); font-size: var(--fs-xs); color: var(--ink-soft); margin-top: 5px; }
.gap { display: inline; font-size: var(--fs-sm); color: var(--watch); border-bottom: 1px dotted var(--watch); }

/* --- learner -------------------------------------------------------------- */
.filters { position: sticky; top: var(--barh, 89px); z-index: 10; }
@media (max-height: 620px) {
  .filters { position: static; }
  .two > .left { position: static !important; max-height: none !important; }
}
.fgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.modhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 7px; }
.stageno { font: 650 var(--fs-xs) var(--mono); width: 18px; height: 18px; flex: none;
  display: grid; place-items: center; border-radius: 2px; color: var(--ground); }
.sla { border-top: 1px solid var(--watch); background: var(--watch-bg); padding: 8px 10px; margin: 10px 0;
  border-radius: 0 0 var(--r) var(--r); }
.sla b { font: 600 var(--fs-xs) var(--mono); letter-spacing: .08em; text-transform: uppercase;
  color: var(--watch); display: block; margin-bottom: 2px; }
.sla span { font-family: var(--mono); font-size: var(--fs-sm); }

/* Signature interaction: the checklist ticks off. */
.ckhead { display: flex; align-items: baseline; gap: 10px; }
.ckcount { font: 600 var(--fs-xs) var(--mono); color: var(--ink-soft);
  border: 1px solid var(--line); border-radius: var(--r); padding: 1px 6px;
  transition: color var(--dur) ease, border-color var(--dur) ease, background-color var(--dur) ease; }
.ckcount.all { color: var(--clear); border-color: var(--clear); background: var(--clear-bg); }
ol.ck { list-style: none; margin: 0; padding: 0; counter-reset: ck; }
.ckitem { display: flex; gap: 9px; align-items: flex-start; padding: 5px 0; counter-increment: ck; }
.tick { flex: none; width: 19px; height: 19px; margin-top: 1px; padding: 0; cursor: pointer;
  border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2);
  display: grid; place-items: center;
  transition: background-color var(--dur) ease, border-color var(--dur) ease; }
.tick:hover { border-color: var(--clear); }
.tick:focus-visible { outline: 2px solid var(--signal); outline-offset: 1px; }
.tick .mark { font: 700 var(--fs-sm) var(--sans); line-height: 1; color: var(--ground);
  transform: scale(0); opacity: 0; transition: transform var(--dur) cubic-bezier(.2,1.5,.4,1), opacity var(--dur) ease; }
.ckitem.on .tick { background: var(--clear); border-color: var(--clear); }
.ckitem.on .tick .mark { transform: scale(1); opacity: 1; }
.cktext { position: relative; font-size: var(--fs-md); transition: color var(--dur) ease; }
.cktext::after { content: ""; position: absolute; left: 0; top: .72em; height: 1px;
  width: 0; background: var(--ink-soft); transition: width 200ms ease; }
.ckitem.on .cktext { color: var(--ink-soft); }
.ckitem.on .cktext::after { width: 100%; }
.ckitem .nu { display: block; margin-top: 3px; font-size: var(--fs-sm); color: var(--ink-soft);
  border-left: 1px solid var(--line); padding-left: 9px; }
.ckitem.on .nu { opacity: .55; }
.ckhint { margin: 8px 0 0; }

[role="radiogroup"] { display: grid; gap: 7px; }
.opt { border: 1px solid var(--line); border-radius: var(--r); padding: 9px 11px; cursor: pointer;
  background: var(--panel-2); transition: border-color var(--dur) ease, background-color var(--dur) ease; }
.opt:hover { border-color: var(--ink-soft); }
.opt:focus-visible { outline: 2px solid var(--signal); outline-offset: 1px; }
.opt[aria-checked="true"].best { border-color: var(--clear); background: var(--clear-bg); }
.opt[aria-checked="true"].ok { border-color: var(--watch); background: var(--watch-bg); }
.opt[aria-checked="true"].poor { border-color: var(--block); background: var(--block-bg); }
.opt .fb { display: none; margin-top: 8px; font-size: var(--fs-sm); }
.opt[aria-checked="true"] .fb { display: block; animation: fbin 160ms ease both; }
@keyframes fbin { from { opacity: 0; } to { opacity: 1; } }
.vd { font: 600 var(--fs-xs) var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.best .vd { color: var(--clear); } .ok .vd { color: var(--watch); } .poor .vd { color: var(--block); }

/* --- planner -------------------------------------------------------------- */
.two { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 860px) {
  .two { grid-template-columns: 330px 1fr; align-items: start; }
  .two > .left { position: sticky; top: var(--barh, 89px);
    max-height: calc(100vh - var(--barh, 89px) - 20px); overflow-y: auto; }
}
.pickhead { margin-bottom: 10px; }
.grp { margin-bottom: 12px; }
.grp > b { display: block; font: 600 var(--fs-xs) var(--mono); letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-soft); margin-bottom: 5px; }
.pr { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; font-size: var(--fs-sm); cursor: pointer; }
.pr input { margin: 3px 0 0; flex: none; }
.pr .nm { font-weight: 600; }
.pr .nt { display: block; color: var(--ink-soft); font-size: var(--fs-xs); }
.seqrow { margin-top: 5px; }
.legend { gap: 12px; }
.wv { display: inline-flex; gap: 6px; align-items: center; }
.wvk { width: 10px; height: 10px; border-radius: 2px; flex: none; }

/* Signature interaction: the graph resolves in wave order, left to right. */
svg.dep { width: 100%; height: auto; display: block; }
svg.dep text { font-family: var(--mono); font-size: 10px; fill: var(--ground); }
svg.dep text.lbl { fill: var(--ink-soft); font-size: 9.5px; letter-spacing: .08em; }
svg.dep path.edge { fill: none; stroke: var(--line); stroke-width: 1.5; }
svg.dep path.edge.bad { stroke: var(--block); stroke-dasharray: 3 3; }
svg.dep g.nd { animation: ndin var(--dur-node) cubic-bezier(.2,.8,.3,1) both; }
@keyframes ndin { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }

/* --- leader --------------------------------------------------------------- */
.stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 12px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-left: 2px solid var(--signal);
  border-radius: var(--r); padding: 12px 13px; }
.stat .n { font: 650 var(--fs-display)/1.1 var(--sans); letter-spacing: -0.02em; }
.stat .l { font-size: var(--fs-sm); color: var(--ink-soft); margin-top: 3px; }
/* Signature interaction: the split bar fills from zero on arrival. */
.split { display: flex; height: 6px; border-radius: 2px; overflow: hidden; background: var(--line); }
.split i { display: block; width: var(--to); animation: fillin 520ms cubic-bezier(.2,.8,.3,1) both; }
.split i.fill-a { background: var(--signal); }
.split i.fill-b { background: var(--w-par); animation-delay: 90ms; }
@keyframes fillin { from { width: 0; } to { width: var(--to); } }
tr.pick { cursor: pointer; transition: background-color var(--dur) ease; }
tr.pick:hover { background: var(--panel-2); }
tr.pick[aria-selected="true"] { background: var(--signal-bg); }
tr.pick:focus-visible { outline: 2px solid var(--signal); outline-offset: -2px; }

/* --- owner ---------------------------------------------------------------- */
.revfield { max-width: 300px; flex: 1 1 220px; }
/* Signature interaction: the review badge changes state crisply. */
.cyc { font: 600 var(--fs-xs) var(--mono); padding: 3px 8px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-soft);
  cursor: pointer; white-space: nowrap; display: inline-flex; gap: 5px; align-items: center;
  transition: color var(--dur) ease, border-color var(--dur) ease, background-color var(--dur) ease; }
.cyc:focus-visible { outline: 2px solid var(--signal); outline-offset: 1px; }
.cyc .g { font-size: var(--fs-xs); line-height: 1; }
.cyc[data-s="approved"] { color: var(--clear); border-color: var(--clear); background: var(--clear-bg); }
.cyc[data-s="in review"] { color: var(--signal); border-color: var(--signal); background: var(--signal-bg); }
.cyc[data-s="drafted"] { color: var(--watch); border-color: var(--watch); background: var(--watch-bg); }
.cyc.bump { animation: bump 240ms cubic-bezier(.2,1.4,.4,1) both; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
</style>
</head>

<header class="bar">
  <div class="wrap">
    <div class="brandrow">
      <span class="brand">Implementation Accelerator</span>
      <span class="teamid">IA-05</span>
      <span class="chip" id="gateChip">gate 0/0</span>
      <span class="here" id="here">Learner</span>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Views">
      <button role="tab" id="tab-learner" aria-controls="view-learner" aria-selected="true" data-v="learner">Learner</button>
      <button role="tab" id="tab-planner" aria-controls="view-planner" aria-selected="false" data-v="planner" tabindex="-1">Dependency Planner</button>
      <button role="tab" id="tab-leader"  aria-controls="view-leader"  aria-selected="false" data-v="leader"  tabindex="-1">Leader</button>
      <button role="tab" id="tab-owner"   aria-controls="view-owner"   aria-selected="false" data-v="owner"   tabindex="-1">Owner</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section role="tabpanel" id="view-learner" class="on" aria-labelledby="tab-learner" tabindex="0">
    <div class="panel sig filters" id="learnerFilters"></div>
    <div id="learnerOut" aria-live="polite"></div>
  </section>
  <section role="tabpanel" id="view-planner" aria-labelledby="tab-planner" tabindex="0">
    <div class="two">
      <div class="left panel" id="prodPick"></div>
      <div id="plannerOut" aria-live="polite"></div>
    </div>
  </section>
  <section role="tabpanel" id="view-leader" aria-labelledby="tab-leader" tabindex="0">
    <div id="leaderOut" aria-live="polite"></div>
  </section>
  <section role="tabpanel" id="view-owner" aria-labelledby="tab-owner" tabindex="0">
    <div id="ownerOut" aria-live="polite"></div>
  </section>
</main>

function wireScenarios() {
    qsa(el('learnerOut'), '[data-scen]').forEach((g) => {
        const id = g.getAttribute('data-scen');
        const choose = (i) => setState((s) => { s.learner.picks[id] = i; });
        g.addEventListener('click', (e) => {
            const o = e.target.closest('[data-opt]');
            if (o)
                choose(parseInt(o.getAttribute('data-opt'), 10));
        });
        g.addEventListener('keydown', (e) => {
            const ev = e;
            const o = ev.target.closest('[data-opt]');
            if (!o)
                return;
            const i = parseInt(o.getAttribute('data-opt'), 10);
            const n = g.querySelectorAll('[data-opt]').length;
            if (ev.key === 'Enter' || ev.key === ' ') {
                ev.preventDefault();
                choose(i);
            }
            else if (ev.key === 'ArrowDown' || ev.key === 'ArrowRight') {
                ev.preventDefault();
                choose((i + 1) % n);
            }
            else if (ev.key === 'ArrowUp' || ev.key === 'ArrowLeft') {
                ev.preventDefault();
                choose((i - 1 + n) % n);
            }
        });
    });
}

/**
 * Inline SVG dependency graph. Columns are waves, so x-position carries the
 * sequence. Blocked products get a leading, visually separate column: "cannot
 * be sequenced" is not a position in the sequence, and putting them anywhere
 * in the ramp would repeat the defect this design exists to avoid.
 */
function depGraph(sel, blocked) {
    const COLW = 158, NODEW = 126, NODEH = 34, ROWH = 46, PADX = 12, PADY = 30;
    const cols = [];
    const blockedIds = sel.filter((id) => blocked[id]);
    if (blockedIds.length)
        cols.push({ key: 'blocked', label: 'BLOCKED', ids: blockedIds });
    const byWave = {};
    sel.forEach((id) => {
        if (blocked[id])
            return;
        const w = R.waveOf(id, sel);
        (byWave[w] = byWave[w] || []).push(id);
    });
    Object.keys(byWave).map(Number).sort((a, b) => a - b).forEach((w) => {
        cols.push({ key: 'w' + w, label: w === 0 ? 'PARALLEL' : 'WAVE ' + w, ids: byWave[w], wave: w });
    });
    if (!cols.length)
        return '';
    const pos = {};
    cols.forEach((c, ci) => {
        c.ids.forEach((id, ri) => {
            pos[id] = { x: PADX + ci * COLW, y: PADY + ri * ROWH, col: ci };
        });
    });
    const maxRows = cols.reduce((a, c) => Math.max(a, c.ids.length), 0);
    const W = PADX * 2 + cols.length * COLW - (COLW - NODEW);
    const H = PADY + maxRows * ROWH + 6;
    const s = ['<svg class="dep" viewBox="0 0 ' + W + ' ' + H +
            '" role="img" aria-labelledby="depT depD" preserveAspectRatio="xMinYMin meet">'];
    s.push('<title id="depT">Go-live sequence for the ' + sel.length + ' selected products</title>');
    s.push('<desc id="depD">' + esc(cols.map((c) => c.label.toLowerCase() + ': ' + c.ids.map((i) => R.byId[i].name).join(', ')).join('. ')) + '. The same information is listed as text below the diagram.</desc>');
    cols.forEach((c, ci) => {
        s.push('<text class="lbl" x="' + (PADX + ci * COLW) + '" y="' + (PADY - 12) + '">' + esc(c.label) + '</text>');
    });
    sel.forEach((id) => {
        const p = R.byId[id];
        if (!p || !pos[id])
            return;
        (p.requires || []).forEach((r) => {
            if (!pos[r])
                return;
            const a = pos[r], b = pos[id];
            const x1 = a.x + NODEW, y1 = a.y + NODEH / 2;
            let x2 = b.x;
            const y2 = b.y + NODEH / 2;
            if (x2 < x1)
                x2 = b.x + NODEW;
            const mx = (x1 + x2) / 2;
            const bad = blocked[id] || blocked[r];
            s.push('<path class="edge' + (bad ? ' bad' : '') + '" d="M' + x1 + ',' + y1 +
                ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2 + '"/>');
        });
    });
    // Signature moment: stagger each node's entrance by its column, so the
    // sequence resolves left to right. Delay is capped so a 22-product order
    // still settles quickly, and the whole thing is disabled under
    // prefers-reduced-motion by the stylesheet.
    cols.forEach((c, ci) => {
        c.ids.forEach((id, ri) => {
            const p = R.byId[id], q = pos[id];
            const isB = !!blocked[id];
            const fill = waveColor(c.wave, isB);
            let reason = '';
            if (isB) {
                const br = R.blockReason(id, sel);
                const bits = [];
                if (br.missing.length)
                    bits.push('not on the order: ' + br.missing.map((x) => R.byId[x] ? R.byId[x].name : x).join(', '));
                if (br.stalled.length)
                    bits.push('waiting on: ' + br.stalled.map((x) => R.byId[x] ? R.byId[x].name : x).join(', '));
                reason = ' — blocked (' + bits.join('; ') + ')';
            }
            const nm = p.name.length > 20 ? p.name.slice(0, 19) + '…' : p.name;
            const delay = Math.min(ci * 90 + ri * 25, 700);
            s.push('<g class="nd" style="animation-delay:' + delay + 'ms">');
            s.push('<title>' + esc(p.name + reason) + '</title>');
            s.push('<rect class="node" x="' + q.x + '" y="' + q.y + '" width="' + NODEW + '" height="' + NODEH +
                '" rx="3" fill="' + fill + '"' +
                (isB ? ' stroke="var(--block)" stroke-width="1.5" stroke-dasharray="4 3" fill-opacity="0.22"' : '') + '/>');
            s.push('<text x="' + (q.x + 8) + '" y="' + (q.y + 21) + '"' + (isB ? ' fill="var(--block)"' : '') + '>' +
                esc(nm) + (isB ? ' ⚠' : '') + '</text>');
            s.push('</g>');
        });
    });
    s.push('</svg>');
    return s.join('');
}

        esc(MODULES_DATA.stagesSrc) + '</p></div>');
    const list = (lf.stage ? modules.filter((m) => m.stage === lf.stage) : modules.slice())
        .sort((a, b) => stageIx[a.stage] - stageIx[b.stage] || a.day - b.day);
    out.push('<h2 class="sec">Modules' + (lf.stage ? ' · filtered to ' + esc(stageLabel[lf.stage]) : '') + '</h2>');
    out.push('<div class="panel">');
    if (lf.stage) {
        out.push('<div class="row" style="margin-bottom:8px"><span class="chip sig">' + esc(stageLabel[lf.stage]) +
            '</span><button class="btn" id="bClearStage">Clear filter</button></div>');
    }
    out.push('<div class="scrollx"><table><thead><tr><th>ID</th><th>Title</th><th>Day</th><th>Delivery</th>' +
        '<th>Practice</th><th>Status</th></tr></thead><tbody>');
    list.forEach((m) => {
        out.push('<tr><td><span class="chip sig">' + esc(m.id) + '</span></td><td><b>' + esc(m.title) + '</b></td>' +
            '<td class="mono">' + esc(m.day) + '</td><td class="soft">' + (m.delivery === 'self' ? 'self-paced' : 'live') + '</td>' +
            '<td class="soft">' + (m.practice ? esc(m.practice) : '—') + '</td>' +
            '<td><span class="chip ' + (isApproved(m) ? 'clear' : 'watch') + '">' +
            (isApproved(m) ? '✓ ' : '○ ') + esc(reviewOf(m)) + '</span></td></tr>');
    });
    out.push('</tbody></table></div></div>');
    out.push('<h2 class="sec">What a leader can conclude today</h2><div class="panel"><ul class="sm bullets">');
    out.push('<li>All ' + stages.length + ' Add-On journey stages have at least one drafted module.</li>');
    out.push('<li><b>' + ap + ' of ' + total + '</b> modules have passed SME review. Until that moves, Learner withholds content by design.</li>');
    out.push('<li><b class="mono">' + todo + '</b> open gap markers remain inside module content, each naming the document or SME question it waits on.</li>');
    out.push('<li>Coverage is <b>Engagement Coordinator / Add-On only</b>; the other three implementation types and the EM role are selectable but deliberately unfilled.</li>');
    out.push('</ul></div>');
    el('leaderOut').innerHTML = out.join('');
    qsa(el('leaderOut'), '[data-stage]').forEach((tr) => {
        const pick = () => {
            const id = tr.getAttribute('data-stage');
            setState((s) => { s.leader.stage = s.leader.stage === id ? null : id; });
        };
        tr.onclick = pick;
        tr.onkeydown = (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                pick();
            }
        };
    });
    onClick(el('leaderOut'), '[data-sort]', (b) => {
        setState((s) => { s.leader.sort = b.getAttribute('data-sort'); });
    });
    const cs = elMaybe('bClearStage');
    if (cs)
        cs.onclick = () => setState((s) => { s.leader.stage = null; });
}
// view-owner.ts — source library, documented gaps, module registry, and the
// approval gate that decides what Learner may show.
//
// Signature interaction for this view: the review badge. One click cycles
// drafted -> in review -> approved, the badge changes shape and colour on the
// spot, and Learner's available modules change with it. The moment of delight
// here is also the governance demo, so it is worth making crisp.
/** Normalise any review string to one of the three cycle positions. */
function reviewShort(r) {
    if (/^approved/i.test(r))
        return 'approved';
    if (/^in review/i.test(r))
        return 'in review';
    return 'drafted';
}
/** Paired glyph so the status is never signalled by colour alone. */
function reviewGlyph(short) {
    return short === 'approved' ? '✓' : short === 'in review' ? '◑' : '○';
}
function renderOwner() {
    const ap = approvedCount();
    const out = [];
    out.push('<h2 class="sec">Approval gate</h2>');
    out.push('<div class="panel' + (ap ? ' clear' : ' block') + '">');
    out.push('<p class="sm" style="margin:0 0 9px"><b class="mono">' + ap + ' of ' + modules.length +
        '</b> modules are past the gate. All ' + modules.length + ' ship as <span class="mono">drafted</span>, ' +
        'because no RealPage SME has reviewed the drafted content.</p>');
    out.push('<p class="sm soft" style="margin:0 0 10px">Click a status badge in the registry to cycle it ' +
        '<span class="mono">drafted → in review → approved</span>. Learner updates immediately — ' +
        'that is the gate working, not a badge changing colour. Changes live in this page only: they are ' +
        '<b>not</b> written to storage and do not survive a reload, so an approval can never outlive the ' +
        'content it approved.</p>');
    out.push('<div class="row"><div class="revfield"><label class="fl" for="fRev">Reviewer name (stamped on approvals)</label>' +
        '<input type="text" id="fRev" placeholder="Your full name" value="' + esc(state.owner.reviewer) + '"></div>');
    out.push('<button class="btn" id="bResetAp">Reset all to shipped state</button></div>');
    out.push('</div>');
    out.push('<h2 class="sec">Module registry</h2><div class="panel scrollx"><table>');
    out.push('<thead><tr><th>ID</th><th>Title</th><th>Stage</th><th>Day</th><th>Delivery</th><th>Review status</th></tr></thead><tbody>');
    modules.forEach((m) => {
        const short = reviewShort(reviewOf(m));
        out.push('<tr><td><span class="chip sig">' + esc(m.id) + '</span></td>');
        out.push('<td><b>' + esc(m.title) + '</b><span class="cite">' + esc(m.source) + '</span></td>');
        out.push('<td class="soft">' + esc(stageLabel[m.stage]) + '</td><td class="mono">' + esc(m.day) + '</td>');
        out.push('<td class="soft">' + (m.delivery === 'self' ? 'self-paced' : 'live') + '</td>');
        out.push('<td><button class="cyc" data-cyc="' + esc(m.id) + '" data-s="' + esc(short) +
            '" aria-label="Review status of ' + esc(m.id) + ': ' + esc(short) + '. Activate to cycle."><span class="g">' +
            reviewGlyph(short) + '</span> ' + esc(short) + '</button>');
        if (short === 'approved' && state.owner.reviewer)
            out.push('<span class="cite">by ' + esc(state.owner.reviewer) + '</span>');
        if (!Object.prototype.hasOwnProperty.call(state.owner.overrides, m.id)) {
            out.push('<span class="cite">shipped: ' + esc(m.review) + '</span>');
        }
        out.push('</td></tr>');
    });
    out.push('</tbody></table></div>');
    out.push('<h2 class="sec">Gaps found in the source set</h2>');
    out.push('<div class="panel watch"><p class="sm" style="margin:0">' + esc(SOURCES_DATA.gapsNote) + '</p></div>');
    out.push('<div class="panel scrollx"><table><thead><tr><th>ID</th><th>Document</th><th>Where</th>' +
        '<th>Finding</th><th>Affects</th></tr></thead><tbody>');
    (SOURCES_DATA.gaps || []).forEach((g) => {
        out.push('<tr><td><span class="chip watch">' + esc(g.id) + '</span></td><td class="sm">' + esc(g.doc) + '</td>' +
            '<td class="mono xs">' + esc(g.where) + '</td><td class="sm">' + esc(g.finding) + '</td>' +
            '<td class="soft">' + esc(g.affects) + '</td></tr>');
    });
    out.push('</tbody></table></div>');
    out.push('<h2 class="sec">Source library</h2>');
    out.push('<div class="panel"><p class="sm soft" style="margin:0">' + (SOURCES_DATA.sources || []).length +
        ' sponsor-provided documents. Office files were converted to plain text by a local ZIP/XML parser — ' +
        'no model, no key, no network. Originals are held unmodified in the team’s Teams channel connected ' +
        'SharePoint workspace under <span class="mono">01_Sponsor_Inputs/originals/</span>.</p></div>');
    out.push('<div class="panel scrollx"><table><thead><tr><th>Document</th><th>Version</th><th>Ingest</th>' +
        '<th>Sponsor</th><th>Used by</th></tr></thead><tbody>');
    (SOURCES_DATA.sources || []).forEach((s) => {
        out.push('<tr><td class="sm"><b>' + esc(s.doc) + '</b></td><td class="sm">' + gaps(s.version) + '</td>' +
            '<td class="mono xs">' + esc(s.mode) + '</td><td>' +
            (s.sponsorProvided ? '<span class="chip clear">✓ yes</span>' : '<span class="chip">no</span>') + '</td>' +
            '<td class="sm">' + (s.usedByModules.length
            ? s.usedByModules.map((i) => '<span class="chip sig">' + esc(i) + '</span>').join(' ')
            : '<span class="soft">context only</span>') + '</td></tr>');
    });
    out.push('</tbody></table></div>');
    out.push('<h2 class="sec">Boundaries this artifact keeps</h2><div class="panel"><ul class="sm bullets">');
    out.push('<li><b>No inference at run time.</b> All AI work happened at authoring time. This page reads its own inlined data and applies documented rules.</li>');
    out.push('<li><b>No network calls, no credentials.</b> Nothing to configure, nothing to leak.</li>');
    out.push('<li><b>No real client names.</b> Every customer and property-management-company name is the placeholder <span class="mono">PMC</span>.</li>');
    out.push('<li><b>Human review is a gate, not a label.</b> Drafted modules are withheld from Learner until approved here.</li>');
    out.push('<li><b>Gaps are shown, never filled.</b> Every open marker names the document or question it waits on.</li>');
    out.push('</ul></div>');
    el('ownerOut').innerHTML = out.join('');
    el('fRev').oninput = (e) => {
        state.owner.reviewer = e.target.value;
    };
    el('bResetAp').onclick = () => setState((s) => { s.owner.overrides = {}; });
    qsa(el('ownerOut'), '[data-cyc]').forEach((b) => {
        b.onclick = () => {
            const id = b.getAttribute('data-cyc');
            const cur = b.getAttribute('data-s');
            const next = REVIEW_CYCLE[(REVIEW_CYCLE.indexOf(cur) + 1) % REVIEW_CYCLE.length];
            setState((s) => { s.owner.overrides[id] = next; });
            const again = el('ownerOut').querySelector('[data-cyc="' + id + '"]');
            if (again) {
                again.focus();
                // Re-trigger the state-change flourish on the rebuilt button.
                again.classList.remove('bump');
                void again.offsetWidth;
                again.classList.add('bump');
            }
        };
    });
}
// main.ts — render dispatch and boot. Compiled last, so everything it calls
// is already defined in the concatenated output.
/** Keep --barh equal to the sticky header's measured height, so the panels
 *  pinned beneath it sit flush. Re-measured on resize because the brand row
 *  wraps at narrow widths; a hardcoded offset leaves a gap that scrolling
 *  content bleeds through. */
function syncBarHeight() {
    const b = document.querySelector('header.bar');
    if (!b)
        return;
    document.documentElement.style.setProperty('--barh', Math.round(b.getBoundingClientRect().height) + 'px');
}
function render(opts) {
    const o = opts || {};
    const chip = el('gateChip');
    const n = approvedCount();
    chip.textContent = 'gate ' + n + '/' + modules.length;
    chip.className = 'chip ' + (n === 0 ? 'watch' : 'clear');
    if (state.view === 'learner') {
        if (!o.keepFilters)
            renderFilters();
        renderLearner();
    }
    else if (state.view === 'planner') {
        if (!o.keepPicker)
            renderPicker();
        renderPlanner();
    }
    else if (state.view === 'leader') {
        renderLeader();
    }
    else if (state.view === 'owner') {
        renderOwner();
    }
}
function showBootError(err) {
    const main = document.querySelector('main');
    if (main) {
        main.innerHTML =
            '<div class="panel block"><h3>Data failed to load</h3>' +
                '<p class="sm">One of this file’s embedded data blocks could not be parsed, so no view can render. ' +
                'The file is probably truncated or was edited by hand.</p>' +
                '<p class="sm mono">' + esc(String(err && err.message)) + '</p>' +
                '<p class="sm soft">Re-copy <span class="mono">app.html</span> from the team’s Teams channel ' +
                'connected SharePoint workspace.</p></div>';
    }
    const chip = elMaybe('gateChip');
    if (chip) {
        chip.textContent = 'data error';
        chip.className = 'chip block';
    }
}
function readJSON(id) {
    const node = document.getElementById(id);
    if (!node)
        throw new Error('missing data block #' + id);
    return JSON.parse(node.textContent || '');
}
function boot() {
    try {
        MODULES_DATA = readJSON('data-modules');
        PRODUCTS_DATA = readJSON('data-products');
        SOURCES_DATA = readJSON('data-sources');
    }
    catch (e) {
        showBootError(e);
        return;
    }
    initData();
    syncBarHeight();
    window.addEventListener('resize', syncBarHeight);
    initRouter();
    restorePrefs();
    let v = viewFromHash();
    if (!v) {
        // No route in the URL: fall back to the last view this viewer used.
        const p = lsGet();
        v = (p && p.view && VIEWS.indexOf(p.view) !== -1) ? p.view : 'learner';
        try {
            window.history.replaceState(null, '', '#/' + v);
        }
        catch (e) { /* opaque origin */ }
    }
    applyView(v);
}
boot();
</script>
